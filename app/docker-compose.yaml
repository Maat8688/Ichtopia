# Flask app with SQL database
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt 
      - ./certs:/certs:ro 
      - ./logs:/app/logs

    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - db
    environment:
      - FLASK_APP=src.__init__:app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/main
      - SECRET_KEY=${SECRET_KEY}
      - KAHOOT_HOST_CODE=${KAHOOT_HOST_CODE}
    restart: always
    command: flask run --host=0.0.0.0 --port=80

  
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
