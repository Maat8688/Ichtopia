# Flask app with SQL database
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt 
      - ./certs:/certs:ro 

    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - db
    environment:
      - FLASK_APP=src.__init__:app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/main
    restart: always
    command: gunicorn -w 4 -b 0.0.0.0:443 \ 
             --certfile=/certs/cert.pem \ 
             --keyfile=/certs/privkey.pem \ 
             src.__init__:app
  
  
  
  
  
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
