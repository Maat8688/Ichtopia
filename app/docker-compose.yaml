# Flask app - draait zonder database.
#
# De db-service (Postgres) is verwijderd omdat niets in de app hem nog
# gebruikt; zie het commentaarblok in src/__init__.py. De oude versie met
# Postgres staat in de git-historie en in DOCKER.md.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./certs:/certs:ro
    ports:
      - "443:443"
      - "80:80"
    env_file:
      - .env
    environment:
      - FLASK_APP=src.__init__:app
    restart: always
    command: flask run --host=0.0.0.0 --port=80
