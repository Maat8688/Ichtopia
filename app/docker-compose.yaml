# Flask app with SQL database
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./certs:/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FLASK_APP=src.__init__:app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/main
    restart: always
    command: flask run --host=0.0.0.0 --port=80

  db:
    # Must match the major version that initialised the postgres_data volume.
    # Postgres refuses to start on a data directory written by a newer major.
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d main"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  postgres_data:
