# Flask app met Postgres, en Caddy ervoor voor https.
#
#   internet --(80/443)--> caddy --(8000, alleen intern)--> web --> db
#
# Alleen Caddy is van buitenaf bereikbaar. De app en de database hangen alleen
# aan het interne Docker-netwerk.
services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificaten; bewaren, anders vraagt hij ze steeds opnieuw aan
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - FLASK_APP=src.__init__:app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/main
      - SECRET_KEY=${SECRET_KEY}
      - KAHOOT_HOST_CODE=${KAHOOT_HOST_CODE}
      # Er zit https voor (Caddy), dus cookies alleen over https.
      - COOKIE_SECURE=1
      # Het echte IP van bezoekers komt van Caddy (X-Forwarded-For).
      - TRUST_PROXY=1
      # Het IP-adres (of de reeks) van het schoolnetwerk, voor /statistieken:
      # wie op school zit telt dan apart en niet mee voor een provincie.
      # Leeg laten mag. Voorbeeld in .env: SCHOOL_NETWERK=145.97.12.34
      - SCHOOL_NETWERK=${SCHOOL_NETWERK:-}
    restart: always
    # Een worker met threads: alle quizzen en duels staan in het geheugen van
    # dit ene proces. Niet meer workers zetten, dan raken spelers elkaar kwijt.
    command: >
      gunicorn src:app
      --worker-class gthread --workers 1 --threads 100
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -

  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: main
    # Bewust geen 'ports': de database is alleen bereikbaar voor de app.
    # Zelf erin kijken kan met: docker compose exec db psql -U <gebruiker> main
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
