  <g id="background">
    {% for background in map.backgroundElements %}
      {{ background | safe }}
    {% endfor %}
  </g>
  {# Alleen in de aanwijs-modus zijn de gebieden knoppen. Elders is de kaart
     illustratie en hoort hij niet in de tabvolgorde. #}
  {% set klikbaar = klikbaar | default(false) %}
  <g id="questions">
    {% for question in map.questions %}
      <g Id="{{ map.hash(question.id) }}" class="{{ question.category }}" state="{{ map.getQuestionState(question) }}"{% if klikbaar %} tabindex="0" role="button"{% endif %}>
        {{ question.svg | safe }}
      </g>
    {% endfor %}
  </g>
  <g id="foreground">
    {% for foreground in map.foregroundElements %}
      {{ foreground | safe }}
    {% endfor %}
  </g>
  <circle id="marker" class="marker" r="0" visibility="hidden" vector-effect="non-scaling-stroke"/>
</svg>

<style>
  /* Kaartdata naar het palet. De inline kleuren uit de SVG-bestanden
     worden hier overschreven, de bestanden zelf blijven ongewijzigd. */
  #map [style*="fill:#d4edfc"] { fill: var(--paper-2) !important; }
  #map [style*="fill:#fffbdb"],
  #map [style*="fill:#ecf3da"],
  #map [style*="fill:#e4eab9"],
  #map [style*="fill:#ffffff"] { fill: var(--paper) !important; }
  #map [style*="fill:#1a1a18"] { fill: var(--ink) !important; }
  #map [style*="fill:#9c9c9c"] { fill: var(--rule) !important; }
  #map [style*="stroke:#009ee3"] { stroke: var(--atlas) !important; }
  #map [style*="stroke:#d2050c"],
  #map [style*="stroke:#1a1a18"] { stroke: var(--ink) !important; }
  #map [style*="stroke:#575656"] { stroke: var(--rule) !important; }

  /* Achtergrond van de gegenereerde kaarten (Amerika). De oudere kaarten
     dragen hun eigen stijl inline mee en trekken zich hier niets van aan. */
  #background .zee {
    fill: #dde7e9;
  }

  #background path {
    fill: var(--paper-2);
    stroke: var(--rule);
    stroke-width: 0.6;
  }

  /* Vraagelementen */
  #questions > g {
    cursor: pointer;
    fill: var(--paper);
    transition: fill 0.2s ease, fill-opacity 0.2s ease;
  }

  #questions > g.Steden,
  #questions > g.Hoofdsteden,
  #questions > g.Plaatsen {
    fill: var(--ink);
  }

  #questions > g.Landen,
  #questions > g.Provincies {
    fill: var(--paper-2);
    stroke: var(--ink);
    stroke-width: 0.6;
  }

  #questions > g.Gebergten {
    fill: #c9bfa4;
    fill-opacity: 0.75;
  }

  /* Een oceaan die nog niet gevraagd is laat de zee eronder gewoon zien. */
  #questions > g.Wateren:not(.active):not([state="Correct"]):not([state="Incorrect"]) path.zeevlak {
    fill: none;
    /* Zonder vulling vangt een vorm geen muisklikken meer op, dus dat hier
       expliciet aanzetten. De zee ligt onder het land, dus hij zit niets in de weg. */
    pointer-events: all;
  }

  /* Onzichtbaar maar wel aanklikbaar: het brede raakvlak onder een rivier. */
  #questions > g.Wateren path.raakvlak {
    fill: none;
    stroke: transparent;
    stroke-width: 11;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: stroke;
  }

  #questions > g.Wateren path.lijn {
    fill: none;
    stroke: var(--atlas);
    stroke-width: 1.6;
    stroke-linecap: round;
  }

  #questions > g.Wateren {
    fill: var(--paper-2);
  }

  #questions > g.Gebieden {
    fill: var(--ink);
    fill-opacity: 0.06;
  }

  #questions > g:hover:not(.active) {
    fill: var(--track);
  }

  #questions > g.Steden,
  #questions > g.Hoofdsteden:hover:not(.active) {
    fill: var(--atlas);
  }

  #questions > g.Gebieden:hover:not(.active) {
    fill: var(--ink);
    fill-opacity: 0.16;
  }

  /* Stand: gekend in atlasblauwgroen, fout in rode pen */
  #questions > g[state="Correct"] {
    fill: var(--atlas);
    fill-opacity: 0.28;
  }

  #questions > g.Steden,
  #questions > g.Hoofdsteden[state="Correct"] {
    fill: var(--atlas);
    fill-opacity: 1;
  }

  #questions > g[state="Incorrect"] {
    fill: var(--pen);
    fill-opacity: 0.28;
  }

  #questions > g.Steden,
  #questions > g.Hoofdsteden[state="Incorrect"] {
    fill: var(--pen);
    fill-opacity: 1;
  }

  /* Huidige vraag: rode pen */
  #questions > g.active {
    fill: var(--pen);
    fill-opacity: 0.2;
    stroke: var(--pen);
    stroke-width: 2;
  }

  #questions > g.active > path {
    vector-effect: non-scaling-stroke;
  }

  #questions > g.Steden,
  #questions > g.Hoofdsteden.active {
    fill: var(--pen);
    fill-opacity: 1;
    stroke: none;
  }

  /* Met het toetsenbord aanwijzen: laat zien waar je bent. */
  #questions > g:focus {
    outline: none;
  }

  #questions > g:focus-visible {
    fill: var(--track);
    stroke: var(--atlas);
    stroke-width: 3;
  }

  #questions > g:focus-visible > path {
    vector-effect: non-scaling-stroke;
  }
</style>
