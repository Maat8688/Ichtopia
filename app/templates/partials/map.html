
<svg id="map" aspect-ratio="map.viewBox[2]/map.viewBox[3]" viewBox="{{map.getViewBox()}}" xmlns="http://www.w3.org/2000/svg">
  <g id="background">
    {% for background in map.backgroundElements %}
      {{ background | safe }}
    {% endfor %}
  </g>
  <g id="questions">
    {% for question in map.questions %}
      <g Id="{{ map.hash(question.id) }}" class="{{ question.category }}" state="{{ map.getQuestionState(question) }}">
        {{ question.svg | safe }}
      </g>
    {% endfor %}
  </g>
  <g id="foreground">
    {% for foreground in map.foregroundElements %}
      {{ foreground | safe }}
    {% endfor %}
  </g>
</svg>

<style>
  #questions > g {
    cursor: pointer;
    fill: #fffbdb;
    transition: all 0.25s ease-in-out;
  }

  #questions > g.Steden {
    cursor: pointer;
    fill: #c7bd74;
    transition: all 0.25s ease-in-out;
  }

  #questions > g.Gebieden {
    cursor: pointer;
    fill: #b3a86423;
    transition: all 0.25s ease-in-out;
  }

  #questions > g:hover:not(.active):not([state="Correct"]) {
    filter: brightness(0.9);
    z-index: 1;
  }
  
  #questions > g.Gebieden:hover:not(.active):not([state="Correct"]) {
    fill: #00000023;
    stroke-width: 2px;
    stroke:#421b1b;
  }

  #questions > g:active {
    filter: brightness(0.85);
  }

  #questions > g.Gebieden:active {
    stroke-width: 2px;
    stroke:#421b1b;
  }

  #questions > g[state="Incorrect"] {
    fill: #f3b7b7;
  }

  #questions > g.Steden[state="Incorrect"] {
    fill: #b37b7b;
  }

  #questions > g.Gebieden[state="Correct"] {
    fill: #e0a4a4;
  }

  #questions > g[state="Correct"] {
    fill: #b7f3b7;
  }

  #questions > g.Steden[state="Correct"] {
    fill: #6ca56c;
  }

  #questions > g.Gebieden[state="Correct"] {
    fill: #94d39480;
  }

  @keyframes upDown {
    0% { transform: translateY(0);}
    50% { transform: translateY(-4px); } /* Move up */
    100% { transform: translateY(0); } /* Return to starting position */
  }

  #questions > g.active {
    fill: #b7b7f3;
  }

  #questions > g.Steden.active {
    fill: #c848ff;
    animation: upDown 2s ease-in-out infinite;
    box-shadow: 0px 20px 15px rgba(0, 0, 0, 0.3); 
  }

  #questions > g.Gebieden.active {
    fill: #c848ff;
    stroke-width: 2px;
    stroke:#421b1b;
  }
</style>

<script>
  urlParams = new URLSearchParams(window.location.search);
  
  socket.on('updateMap', function(data) {
    var question = document.getElementById(data.questionId);
    question.classList.remove('active');
    question.classList.add(data.status);
  });

  socket.on('connect', function(data) {
    socket.emit('getQuestion', {'sessionToken': urlParams.get('sessionToken')});
    socket.emit('getProgressbar', {'sessionToken': urlParams.get('sessionToken')})
  });

  socket.on('setMapState', function(data) { // Data is a dict {questionID: State}
    for (const [questionId, state] of Object.entries(data)) {
    var question = document.getElementById(questionId);
    question.setAttribute('state', state);
  }
  });
</script>
