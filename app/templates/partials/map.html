{% with klikbaar = (map.sessionMode == 3) %}{% include('partials/mapSvg.html') %}{% endwith %}

<script>
  urlParams = new URLSearchParams(window.location.search);
  
  socket.on('updateMap', function(data) {
    var question = document.getElementById(data.questionId);
    question.classList.remove('active');
    question.classList.add(data.status);
  });

  function vraagStandOp() {
    socket.emit('getQuestion', {'sessionToken': urlParams.get('sessionToken')});
    socket.emit('getProgressbar', {'sessionToken': urlParams.get('sessionToken')});
  }

  // Zonder verbinding gebeurt er niets als je klikt of typt. Zeg dat dan ook,
  // anders lijkt de kaart gewoon kapot.
  function toonVerbinding(kwijt) {
    var melding = document.getElementById('verbinding');
    if (melding) {
      melding.hidden = !kwijt;
    }
  }

  // Bij een nieuwe of herstelde verbinding.
  socket.on('connect', function () {
    toonVerbinding(false);
    vraagStandOp();
  });
  socket.on('disconnect', function () { toonVerbinding(true); });
  socket.on('connect_error', function () { toonVerbinding(true); });

  // En meteen, want de verbinding kan al openstaan voordat dit script draait.
  if (socket.connected) {
    vraagStandOp();
  }

  socket.on('setMapState', function(data) { // Data is a dict {questionID: State}
    for (const [questionId, state] of Object.entries(data)) {
    var question = document.getElementById(questionId);
    question.setAttribute('state', state);
  }
  });

  // Ringmarker om de gevraagde stad. Voor landen en gebieden wordt de
  // omtrek zelf in rode pen getekend (zie .active hierboven) - maar bij een
  // land als Monaco of Luxemburg is die omtrek een paar pixels groot en zie
  // je niet dat er iets oplicht. Daar komt dus dezelfde ring omheen.
  var RING_ONDER = 26; // pixels op het scherm

  socket.on('question', function(data) {
    var marker = document.getElementById('marker');
    var element = document.getElementById(data.question);
    if (!element) {
      // Bij aanwijzen op de kaart staat hier de naam en niet een gebied:
      // dan zou een ring het antwoord weggeven.
      marker.setAttribute('visibility', 'hidden');
      return;
    }

    var stad = ['Steden','Hoofdsteden','Plaatsen'].some(function(c){
      return element.classList.contains(c);
    });
    var opScherm = element.getBoundingClientRect();
    var klein = Math.max(opScherm.width, opScherm.height) < RING_ONDER;

    if (!stad && !klein) {
      marker.setAttribute('visibility', 'hidden');
      return;
    }

    var box = element.getBBox();
    var viewBox = document.getElementById('map').viewBox.baseVal;
    var maat = Math.max(viewBox.width, viewBox.height);
    var straal = Math.max(box.width, box.height) / 2 + maat * 0.012;
    marker.setAttribute('cx', box.x + box.width / 2);
    marker.setAttribute('cy', box.y + box.height / 2);
    // Ondergrens, anders is de ring om Monaco zelf ook nog onzichtbaar.
    marker.setAttribute('r', Math.max(straal, maat * 0.02));
    marker.setAttribute('visibility', 'visible');
  });
</script>
