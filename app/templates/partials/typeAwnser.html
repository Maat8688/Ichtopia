<form class="answer-form" id="answerForm" autocomplete="off">
    <input class="field" type="text" name="textInput" placeholder="Naam" autocapitalize="off" autocomplete="off" aria-label="Antwoord" />
    <div class="actions actions-end">
        <button type="submit" class="btn btn-primary">Nakijken</button>
    </div>
</form>

<script>
    socket.on('question', function(data) {
        var mapElement = document.getElementById(data.question);
        var textInput = document.querySelector('input[name="textInput"]');

        // Remove the active element from all mapelements
        var questionsElement = document.getElementById("questions");
        var questionElements = questionsElement.getElementsByTagName('g');
        Array.from(questionElements).forEach(function(element) {
            element.classList.remove('active');
        });

        if (mapElement) {
            mapElement.classList.add('active');
        }

        textInput.value = '';
        textInput.focus();
    });

    document.getElementById('answerForm').addEventListener('submit', function(event) {
        event.preventDefault();
        var textInput = document.querySelector('input[name="textInput"]');
        var inputValue = textInput.value.trim();
        if (inputValue === '') {
            textInput.focus();
            return;
        }
        lastAnswer = inputValue;
        socket.emit('answerQuestion', {'awnser': inputValue, 'hashed':false, 'sessionToken': urlParams.get('sessionToken')});
    });
</script>
