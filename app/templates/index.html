<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IchTopia | Topo leren op het Ichthus Lyceum</title>
    <meta
      name="description"
      content="IchTopia: topografie oefenen voor leerlingen van het Ichthus Lyceum in Driehuis."
    />
    <meta name="theme-color" content="#006b85" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socketio.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/logo_small.png') }}"
    />
  </head>
  <body>
    
    <div class="loadingScreen">
      <div class="spinner"></div>
      <img
        id="logo_loading"
        src="{{ url_for('static', filename='img/logo.png') }}"
      />
      <p>Loading...</p>
    </div>
    <header class="school-header">
      <div class="school-header__inner">
        <span class="school-header__mark">
          {% include 'partials/ichthus.html' %}
        </span>
        <div>
          <p class="school-header__name">Ichthus Lyceum</p>
          <p class="school-header__sub">
            Gymnasium, Atheneum en Havo &middot; Driehuis
          </p>
        </div>
        <span class="school-header__spacer"></span>
      </div>
    </header>
    <main>
      <div id="container">

        <img
        id="logo"
        src="{{ url_for('static', filename='img/logo.png') }}"
        alt="Logo"
        />      
      </div>
      
      <h1 id="Title">Ich<span>Topia</span></h1>
      <hr class="expanding" />
      <p id="SubTitle">Topografie oefenen op het Ichthus Lyceum</p>

      <div id="kaarten">
        <div class="vertical-nesting">
          <div class="kaart">
            <img
              src="{{ url_for('static', filename='img/Nederland.svg') }}"
              alt="Nederland"
            />
            <button id="Nederland">Nederland</button>
          </div>
          <div class="kaart">
            <div class="margin-bottom">
              <img
                src="{{ url_for('static', filename='img/Europa.svg') }}"
                alt="Europa"
              />
            </div>
            <button id="Europa">Europa</button>
          </div>
        </div>
        <hr />
        <div class="horizontal-single">
          <div class="kaart wide-kaart">
            <div>
              <img
                src="{{ url_for('static', filename='img/Wereld.svg') }}"
                alt="Wereld"
              />
            </div>
            <button id="Wereld">Wereld</button>
          </div>
        </div>

        <!--  <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland3</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland4</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland5</button>
        </div>  -->
      </div>
    </main>
    <footer class="school-footer">
      <p>&copy; 2024 Ichthus Lyceum &middot; Floris Joël Luuk Liam Sami</p>
    </footer>

    <div class="overlay">
      <div class="popup">
        <!-- Close Button -->
        <button class="close">&times;</button>
        <h2 id="KaartTitel">Hier staat een land naam</h2>
        <form method="POST" onsubmit="return validateForm()">
          <input
            type="hidden"
            name="KaartInput"
            id="KaartInput"
            value="Nederland"
          />
          <div id="typeSelect">
            <div class="option">
              <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="Singleplayer"
                  name="type"
                  value="Singleplayer"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
              <label for="Singleplayer">Singleplayer</label>
            </div>
            <div class="option">
              <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="Multiplayer"
                  name="type"
                  value="Multiplayer"
                  disabled
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
              <label for="Multiplayer" title="Coming soon">Multiplayer</label>
            </div>
          </div>
          <div id="ModeSelect">
            <div class="option">
              <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="MultipleChoise"
                  name="mode"
                  value="MultipleChoise"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
              <label for="MultipleChoise">Multiple choice</label>
            </div>
            <div class="option">
              <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="FillInTheBlank"
                  name="mode"
                  value="FillInTheBlank"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
              <label for="FillInTheBlank">Antwoord typen</label>
            </div>
            <div class="option">
              <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="ClickTheCountry"
                  name="mode"
                  value="ClickTheCountry"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
              <label for="ClickTheCountry">Klik het land</label>
            </div>
          </div>
          <div id="questionsSelect"></div>
          <hr />
          <button type="submit">Start</button>
        </form>
      </div>
    </div>
  </body>

  <script>
    function validateForm() {
      const checkboxes = document.querySelectorAll(
        'input[name="questions"]:checked'
      );
      if (checkboxes.length === 0) {
        alert("Kies minimaal één categorie om te oefenen.");
        return false;
      }
      return true;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

  <script>
    const overlay = document.querySelector(".overlay");
    const closeButton = document.querySelector(".popup .close");
    const kaarten = document.querySelectorAll(".kaart");
    const popup = document.querySelector(".popup");
    const kaartInput = document.querySelector("#KaartInput");
    const KaartTitel = document.querySelector("#KaartTitel");
    const loadingScreen = document.querySelector(".loadingScreen");
    const logo = document.querySelector("#logo");
    const questionsSelect = document.querySelector("#questionsSelect");

    window.addEventListener("load", function () {
      loadingScreen.style.display = "none";
    });

    kaarten.forEach((kaart) => {
      kaart.addEventListener("click", () => {
        overlay.classList.add("show");
        kaartInput.value = kaart.querySelector("button").textContent;
        KaartTitel.textContent = kaart.querySelector("button").textContent;

        var category = [];
        if (kaart.querySelector("button").textContent === "Europa") {
          category = ["Landen"];
        } else if (kaart.querySelector("button").textContent === "Nederland") {
          category = ["Steden", "Provincies", "Wateren", "Gebieden"];
        } else if (kaart.querySelector("button").textContent === "Wereld") {
          category = ["Landen", "Steden"];
        } else {
          category = ["Steden", "Provincies", "Wateren", "Gebieden"];
        }

        questionsSelect.innerHTML = "";

        for (var i = 0; i < category.length; i++) {
          var option = document.createElement("div");
          option.classList.add("option");
          option.innerHTML = `
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="checkbox"
                  id="question-${category[i]}"
                  name="questions"
                  value="${category[i]}"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
            </div>
            <label for="question-${category[i]}">${category[i]}</label>
          `;
          questionsSelect.appendChild(option);
        }
      });
    });

    closeButton.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    overlay.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    popup.addEventListener("click", (e) => {
      e.stopPropagation();
    });
    let clickCount = 0;
    let clickTimeout;

    logo.addEventListener("click", function () {
      clickCount++;

      // Start the spin animation
      logo.style.animation = "spin 2s";

      // When animation ends, clear it
      logo.addEventListener("animationend", function () {
        logo.style.animation = "";
      });

      // Check if it's the third click
      if (clickCount === 10) {
        // Perform a special action
   
        confetti({
          particleCount: 100,
          spread: 60,
          origin: { x: 0.5, y: 0.5 },
          angle: 60,
          startVelocity: 50,
          ticks: 200
        });
       
        clickCount = 0;
        clearTimeout(clickTimeout);
      }

      // Reset the count if no click happens within 2 seconds
      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => {
        clickCount = 0;
      }, 2000); // Adjust the timeout period if needed
    });

  </script>
</html>
