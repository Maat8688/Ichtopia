<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topo · Ichthus Lyceum</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socketio.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/design-tokens.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/logo_small.png') }}"
    />
  </head>
  <body>
    <header class="page topbar">
      <h1>Topo</h1>
      <span class="muted">Ichthus · 2025–26</span>
    </header>

    <main class="page">
      <form method="POST" id="startForm" class="start" onsubmit="return validateForm()">
        <input type="hidden" name="type" value="Singleplayer" />

        <h2 class="intro">Kies een kaart</h2>
        <div class="rule-list maps" id="kaarten">
          <label class="row">
            <input class="visually-hidden" type="radio" name="KaartInput" value="Nederland" />
            <span class="name">Nederland</span>
            <span class="status" data-map="Nederland">nog niet begonnen</span>
          </label>
          <label class="row">
            <input class="visually-hidden" type="radio" name="KaartInput" value="Europa" />
            <span class="name">Europa</span>
            <span class="status" data-map="Europa">nog niet begonnen</span>
          </label>
          <label class="row">
            <input class="visually-hidden" type="radio" name="KaartInput" value="Wereld" />
            <span class="name">Wereld</span>
            <span class="status" data-map="Wereld">nog niet begonnen</span>
          </label>
        </div>

        <section id="instellingen" hidden>
          <h2 id="KaartTitel">Kaart</h2>

          <p class="section-label">Vraagvorm</p>
          <div class="rule-list" id="ModeSelect">
            <label class="row">
              <span class="name">Meerkeuze</span>
              <input type="radio" name="mode" value="MultipleChoise" checked />
            </label>
            <label class="row">
              <span class="name">Naam typen</span>
              <input type="radio" name="mode" value="FillInTheBlank" />
            </label>
            <label class="row">
              <span class="name">Aanwijzen op de kaart</span>
              <input type="radio" name="mode" value="ClickTheCountry" />
            </label>
          </div>

          <p class="section-label">Onderdelen</p>
          <div class="rule-list" id="questionsSelect"></div>
          <p class="feedback" id="formError" hidden>Kies minstens één onderdeel.</p>

          <div class="actions actions-end">
            <button type="submit" class="btn btn-primary">Oefenen</button>
          </div>
        </section>
      </form>
    </main>

    <footer>
      <div class="page">
        <p>Gemaakt door Floris, Joël, Luuk, Liam en Sami · geen account nodig</p>
      </div>
    </footer>

    <script>
      const form = document.getElementById("startForm");
      const mapInputs = document.querySelectorAll('input[name="KaartInput"]');
      const settings = document.getElementById("instellingen");
      const kaartTitel = document.getElementById("KaartTitel");
      const questionsSelect = document.getElementById("questionsSelect");
      const formError = document.getElementById("formError");

      const categories = {
        Nederland: ["Steden", "Provincies", "Wateren", "Gebieden"],
        Europa: ["Landen"],
        Wereld: ["Landen", "Steden"],
      };

      function validateForm() {
        const map = document.querySelector('input[name="KaartInput"]:checked');
        if (!map) {
          return false;
        }
        const checked = document.querySelectorAll('input[name="questions"]:checked');
        if (checked.length === 0) {
          formError.hidden = false;
          return false;
        }
        formError.hidden = true;
        try {
          sessionStorage.setItem("topo.map", map.value);
        } catch (e) {}
        return true;
      }

      function showSettings(mapName) {
        kaartTitel.textContent = mapName;
        questionsSelect.innerHTML = "";
        (categories[mapName] || categories.Nederland).forEach(function (category) {
          const row = document.createElement("label");
          row.className = "row";
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = category;
          const box = document.createElement("input");
          box.type = "checkbox";
          box.name = "questions";
          box.value = category;
          box.checked = true;
          row.appendChild(name);
          row.appendChild(box);
          questionsSelect.appendChild(row);
        });
        formError.hidden = true;
        settings.hidden = false;
      }

      mapInputs.forEach(function (input) {
        input.addEventListener("change", function () {
          if (input.checked) {
            showSettings(input.value);
          }
        });
      });

      // Laatste stand per kaart, alleen in deze browser bewaard.
      try {
        const saved = JSON.parse(localStorage.getItem("topo.progress") || "{}");
        document.querySelectorAll(".status[data-map]").forEach(function (el) {
          const p = saved[el.dataset.map];
          if (p && p.total > 0) {
            el.textContent = p.known + " / " + p.total + " gekend";
            el.classList.add("known");
          }
        });
      } catch (e) {}
    </script>
  </body>
</html>
