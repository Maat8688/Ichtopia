      <img

      <div id="kaarten">

                alt="Europa"
              />

            <button id="Europa">Europa</button>

        <div class="horizontal-single">
          <div class="kaart wide-kaart">

          <button id="Nederland">Nederland3</button>
        </div>
        <div class="kaart">
          <img

            alt="Nederland"
          />
          <button id="Nederland">Nederland4</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland5</button>

    </main>

  <!-- ...bovenaan je body... -->
  <svg style="display:none;">
    <symbol id="checkbox-30" viewBox="0 0 22 22">
      <rect x="2" y="2" width="18" height="18" rx="5" fill="white" stroke="currentColor" stroke-width="2"/>
      <polyline points="6,12 10,16 16,8" fill="none" stroke="currentColor" stroke-width="2" style="display:none;" />
    </symbol>
  </svg>
<!-- ...rest van je body... --> <!-- ...bestaande code... -->
  <div class="overlay">
    <div class="popup">
      <!-- Close Button -->
      <button class="close">&times;</button>
      <h2 id="KaartTitel">Hier staat een land naam</h2>
      <form method="POST" onsubmit="return validateForm()">
        <input
          type="hidden"
          name="KaartInput"
          id="KaartInput"
          value="Nederland"
        />


        <!-- Stap 1: Singleplayer/Multiplayer als knoppen -->
        <div class="overlay-step" id="step1">
          <div id="typeSelect" class="button-select-group">
            <button type="button" class="select-btn" data-type="Singleplayer">Singleplayer</button>
            <button type="button" class="select-btn" data-type="Multiplayer" disabled title="Coming soon">Multiplayer</button>
          </div>
          <button type="button" id="toStep2">Volgende</button>
        </div>

        <!-- Stap 2: Spelmodus als knoppen -->
        <div class="overlay-step" id="step2" style="display:none;">
          <div id="ModeSelect" class="button-select-group">
            <button type="button" class="select-btn" data-mode="MultipleChoise">Multiple Choice</button>
            <button type="button" class="select-btn" data-mode="FillInTheBlank">Fill in the blank</button>
            <button type="button" class="select-btn" data-mode="ClickTheCountry">Click the country</button>
          </div>
          <button type="button" id="backToStep1">Terug</button>
          <button type="button" id="toStep3">Volgende</button>
        </div>

        <!-- Stap 3: Categorieën -->
        <div class="overlay-step" id="step3" style="display:none;">
          <div id="questionsSelect"></div>
          <button type="button" id="backToStep2">Terug</button>
          <button type="submit">Start</button>
        </div>
      </form>
    </div>
  </div>
  <!-- ...bestaande code... -->

  <script>
    function validateForm() {
      const checkboxes = document.querySelectorAll(
        'input[name="questions"]:checked'
      );
      if (checkboxes.length === 0) {
        alert("Please select at least one categorie.");
        return false;
      }
      // Check of type en mode gekozen zijn
      if (!window.selectedType || !window.selectedMode) {
        alert("Kies eerst een speltype en modus.");
        return false;
      }
      return true;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

  <script>
    const overlay = document.querySelector(".overlay");
    const closeButton = document.querySelector(".popup .close");
    const kaarten = document.querySelectorAll(".kaart");
    const popup = document.querySelector(".popup");
    const kaartInput = document.querySelector("#KaartInput");
    const KaartTitel = document.querySelector("#KaartTitel");
    const loadingScreen = document.querySelector(".loadingScreen");
    const logo = document.querySelector("#logo");
    const questionsSelect = document.querySelector("#questionsSelect");


    // Overlay stappen
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");
    const toStep2 = document.getElementById("toStep2");
    const toStep3 = document.getElementById("toStep3");
    const backToStep1 = document.getElementById("backToStep1");
    const backToStep2 = document.getElementById("backToStep2");

    // Selectie state
    window.selectedType = null;
    window.selectedMode = null;

    // Singleplayer/Multiplayer selectie
    const typeBtns = document.querySelectorAll('#typeSelect .select-btn');
    typeBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        if (btn.disabled) return;
        typeBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        window.selectedType = btn.dataset.type;
      });
    });

    // Mode selectie
    const modeBtns = document.querySelectorAll('#ModeSelect .select-btn');
    modeBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        modeBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        window.selectedMode = btn.dataset.mode;
      });
    });

    function showStep(step) {
      step1.style.display = "none";
      step2.style.display = "none";
      step3.style.display = "none";
      step.style.display = "block";
    }

    if (toStep2) toStep2.addEventListener("click", () => showStep(step2));
    if (toStep3) toStep3.addEventListener("click", () => showStep(step3));
    if (backToStep1) backToStep1.addEventListener("click", () => showStep(step1));
    if (backToStep2) backToStep2.addEventListener("click", () => showStep(step2));

    window.addEventListener("load", function () {
      loadingScreen.style.display = "none";
    });

    kaarten.forEach((kaart) => {
      kaart.addEventListener("click", () => {
        overlay.classList.add("show");
        kaartInput.value = kaart.querySelector("button").textContent;
        KaartTitel.textContent = kaart.querySelector("button").textContent;
        showStep(step1);

        // Reset selectie
        typeBtns.forEach(b => b.classList.remove('selected'));
        modeBtns.forEach(b => b.classList.remove('selected'));
        window.selectedType = null;
        window.selectedMode = null;

        // Categorieën bepalen
        var category = [];
        if (kaart.querySelector("button").textContent === "Europa") {
          category = ["Landen"];
        } else if (kaart.querySelector("button").textContent === "Nederland") {
          category = ["Steden", "Provincies", "Wateren", "Gebieden"];
        } else if (kaart.querySelector("button").textContent === "Wereld") {
          category = ["Landen", "Steden"];
        } else {
          category = ["Steden", "Provincies", "Wateren", "Gebieden"];
        }

        // Categorieën pas tonen in stap 3
        questionsSelect.innerHTML = "";
        for (var i = 0; i < category.length; i++) {
          var checkbox = document.createElement("div");
          checkbox.classList.add("checkbox-wrapper-30");
          checkbox.innerHTML = `
            <span class="checkbox">
              <input type="checkbox" name="questions" value="${category[i]}" />
              <svg>
                <use xlink:href="#checkbox-30" class="checkbox"></use>
              </svg>
            </span>
            <label for="${category[i]}">${category[i]}</label>
          `;
          questionsSelect.appendChild(checkbox);
        }
      });
    });

    closeButton.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    overlay.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    popup.addEventListener("click", (e) => {
      e.stopPropagation();
    });
    let clickCount = 0;
    let clickTimeout;

    logo.addEventListener("click", function () {
      clickCount++;

      // Start the spin animation
      logo.style.animation = "spin 2s";

      // When animation ends, clear it
      logo.addEventListener("animationend", function () {
        logo.style.animation = "";
      });

      // Check if it's the tenth click
      if (clickCount === 10) {
        // Perform a special action
        confetti({
          particleCount: 100,
          spread: 60,
          origin: { x: 0.5, y: 0.5 },
          angle: 60,
          startVelocity: 50,
          ticks: 200
        });

        clickCount = 0;
        clearTimeout(clickTimeout);
      }

      // Reset the count if no click happens within 2 seconds
      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => {
        clickCount = 0;
      }, 2000);
    });
  </script>
  <!-- ...bestaande code... -->
</html>
