<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topo IchthusLyceum</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socketio.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/logo_small.png') }}"
    />
  </head>
  <body>
    <div class="loadingScreen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <header></header>
    <main>
      <img
        id="logo"
        src="{{ url_for('static', filename='img/logo.png') }}"
        alt="Logo"
      />
      <h1 id="Title">IchTopia</h1>
      <hr class="expanding" />
      <p id="SubTitle">Topo leren op het Ichthus Lyceum</p>

      <div id="kaarten">
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland</button>
        </div>
        <div class="kaart">
          <div>
            <img
              src="{{ url_for('static', filename='img/Europa.svg') }}"
              alt="Nederland"
            />
          </div>
          <button id="Nederland">Europa</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland2</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland3</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland4</button>
        </div>
        <div class="kaart">
          <img
            src="{{ url_for('static', filename='img/Nederland.svg') }}"
            alt="Nederland"
          />
          <button id="Nederland">Nederland5</button>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2024 Ichthus Lyceum | Floris Joël Luuk Liam Sami</p>
    </footer>

    <div class="overlay">
      <div class="popup">
        <!-- Close Button -->
        <button class="close">&times;</button>
        <h2 id="KaartTitel">Nederland</h2>
        <form class="form" method="POST" onsubmit="return validateForm()">
          <div id="typeSelect">
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="Singleplayer"
                  name="type"
                  value="Singleplayer"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Singleplayer">Singleplayer</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="Multiplayer"
                  name="type"
                  value="Multiplayer"
                  disabled
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Multiplayer" title="Coming soon">Multiplayer</label>
          </div>
          <div id="ModeSelect">
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="MultipleChoise"
                  name="mode"
                  value="MultipleChoise"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="MultipleChoise">Multiple Choice</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="FillInTheBlank"
                  name="mode"
                  value="FillInTheBlank"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="FillInTheBlank">Fill in the blank</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input
                  type="radio"
                  id="ClickTheCountry"
                  name="mode"
                  value="ClickTheCountry"
                />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"

                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="ClickTheCountry">Click the country</label>
          </div>
          <div id="questionsSelect">
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input type="checkbox" name="questions" value="Steden" />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Steden">Steden</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input type="checkbox" name="questions" value="Provincies" />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Provincies">Provincies</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input type="checkbox" name="questions" value="Wateren" />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Wateren">Wateren</label>
            <div class="checkbox-wrapper-30">
              <span class="checkbox">
                <input type="checkbox" name="questions" value="Gebieden" />
                <svg>
                  <use xlink:href="#checkbox-30" class="checkbox"></use>
                </svg>
              </span>
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
                <symbol id="checkbox-30" viewBox="0 0 22 22">
                  <path
                    fill="none"
                    stroke="currentColor"
                    d="M5.5,11.3L9,14.8L20.2,3.3l0,0c-0.5-1-1.5-1.8-2.7-1.8h-13c-1.7,0-3,1.3-3,3v13c0,1.7,1.3,3,3,3h13 c1.7,0,3-1.3,3-3v-13c0-0.4-0.1-0.8-0.3-1.2"
                  />
                </symbol>
              </svg>
            </div>
            <label for="Gebieden">Gebieden</label>
          </div>
          <hr />
          <button type="submit">Start</button>
        </form>
      </div>
    </div>
  </body>

  <script>
    function validateForm() {
      const checkboxes = document.querySelectorAll(
        'input[name="questions"]:checked'
      );
      if (checkboxes.length === 0) {
        alert("Please select at least one question type.");
        return false;
      }
      return true;
    }
  </script>

  <script>
    const overlay = document.querySelector(".overlay");
    const closeButton = document.querySelector(".popup .close");
    const kaarten = document.querySelectorAll(".kaart");
    const popup = document.querySelector(".popup");
    const kaartInput = document.querySelector("#Kaart");
    const KaartTitel = document.querySelector("#KaartTitel");
    const loadingScreen = document.querySelector(".loadingScreen");
    const logo = document.querySelector("#logo");
    window.addEventListener("load", function () {
      const loadingScreen = document.querySelector(".loadingScreen");
      loadingScreen.style.display = "none";
    });
    kaarten.forEach((kaart) => {
      kaart.addEventListener("click", () => {
        overlay.classList.add("show");
        kaartInput.value = kaart.querySelector("button").textContent;
        KaartTitel.textContent = kaart.querySelector("button").textContent;
      });
    });

    closeButton.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    overlay.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    popup.addEventListener("click", (e) => {
      e.stopPropagation();
    });
    logo.addEventListener("click", function () {
      logo.style.animation = "spin 2s";

      logo.addEventListener("animationend", function () {
        logo.style.animation = "";
      });
    });
  </script>
</html>
