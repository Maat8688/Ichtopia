<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} · Topo</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/design-tokens.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='img/logo_small.png') }}"
    />
  </head>
  <body>
    <header class="page topbar">
      <h1>Topo</h1>
      <span class="muted">Ichthus · 2026–27</span>
    </header>

    <main class="page error">
      <p class="error-code" aria-hidden="true">{{ code }}</p>
      <h2 class="error-title">{{ title }}</h2>
      <p class="error-text">{{ message }}</p>

      <div class="actions">
        <a class="btn btn-primary" href="{{ url_for('main.index') }}">Naar de startpagina</a>
      </div>
    </main>

    <footer>
      <div class="page">
        <p>Gemaakt door Floris, Joël en Sami · geen account nodig</p>
      </div>
    </footer>
  </body>
</html>
